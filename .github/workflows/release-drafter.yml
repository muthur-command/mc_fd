name: Release Drafter

on:
  push:
    branches:
      - mc_fd

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    if: github.repository_owner == 'muthur-command'
    runs-on: ubuntu-latest
    name: Release Drafter
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Find Next Version
        id: version
        run: |
          set -eo pipefail
          declare -i newpost
          datepre=$(date --utc '+%Y.%m')

          latest=""
          tag_sha=$(git rev-list --tags --max-count=1 2>/dev/null || true)
          if [[ -n "$tag_sha" ]]; then
            latest=$(git describe --tags --abbrev=0 "$tag_sha" 2>/dev/null) || latest=""
          fi

          if [[ -n "$latest" ]]; then
            latest_normalized="${latest#mc_}"
            latestpre=$(echo "$latest_normalized" | awk '{split($0,a,"."); print a[1] "." a[2]}')
          else
            latest_normalized=""
            latestpre=""
          fi

          if [[ -n "$latestpre" && "$latestpre" == "$datepre" ]]; then
            latestpost=$(echo "$latest_normalized" | awk '{split($0,a,"."); print a[3]}')
            if [[ -z "${latestpost}" ]] || ! [[ "${latestpost}" =~ ^[0-9]+$ ]]; then
              latestpost=0
            fi
            newpost=$((latestpost + 1))
          else
            newpost=0
          fi

          version_tag="${datepre}.${newpost}"
          # release-drafter v7 parses versions with semver (no leading zeroes in numeric parts).
          year="${datepre%%.*}"
          month="${datepre#*.}"
          month=$((10#$month))
          semver="${year}.${month}.${newpost}"
          echo "Current version: ${latest:-<no tags>}"
          echo "New target version: $version_tag (Release Drafter version: $semver)"
          echo "version=$version_tag" >> "$GITHUB_OUTPUT"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # Align package.json with the draft release tag before publish (verify-version).
      - name: Sync version to draft release tag
        id: sync_version
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eo pipefail
          current=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [[ "$current" == "$TARGET_VERSION" ]]; then
            echo "package.json already at $TARGET_VERSION"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 script/sync_version.py --set-version "$TARGET_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Bump version to ${TARGET_VERSION}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push version sync commit
        if: steps.sync_version.outputs.changed == 'true'
        run: git push

      - name: Run Release Drafter
        uses: release-drafter/release-drafter@4d75298e00d9e34c483e5ff8c68d0ea1c1940c1e # v7.5.1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.semver }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
