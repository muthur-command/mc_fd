# mc_fd: Vue + pnpm CI (structure aligned with mc_bd ci.yaml — frontend jobs instead of Python/pytest).
---
name: CI
run-name: "${{ github.event_name == 'workflow_dispatch' && format('CI: {0}', github.ref_name) || '' }}"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
      - rc
      - master
      - main
      - mc_fd
  pull_request: ~
  workflow_dispatch:
    inputs:
      full:
        description: "Full run (lint + build regardless of path filter hints)"
        default: false
        type: boolean
      lint-only:
        description: "Run lint only (skip production build)"
        default: false
        type: boolean

env:
  NODE_VERSION: "20"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  info:
    name: Collect information & changes data
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.core_filter.outputs.core }}
      requirements: ${{ steps.core_filter.outputs.requirements }}
      lint_only: ${{ steps.collect.outputs.lint_only }}
      run_build: ${{ steps.collect.outputs.run_build }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Filter for core changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: core_filter
        with:
          filters: .github/ci/core_files.yaml

      - name: Collect additional information
        id: collect
        env:
          CORE_ANY: ${{ steps.core_filter.outputs.core }}
          INPUT_FULL: ${{ github.event.inputs.full }}
          HAS_CI_FULL_RUN_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full-run') }}
          INPUT_LINT_ONLY: ${{ github.event.inputs.lint-only }}
        run: |
          set -euo pipefail
          lint_only=""
          if [[ "${INPUT_LINT_ONLY}" == "true" ]]; then
            lint_only="true"
          fi
          echo "lint_only=${lint_only}" >> "$GITHUB_OUTPUT"

          run_build="false"
          if [[ "${GITHUB_REF}" == refs/heads/dev ]] \
            || [[ "${GITHUB_REF}" == refs/heads/master ]] \
            || [[ "${GITHUB_REF}" == refs/heads/main ]] \
            || [[ "${GITHUB_REF}" == refs/heads/rc ]] \
            || [[ "${GITHUB_REF}" == refs/heads/mc_fd ]] \
            || [[ "${CORE_ANY}" == "true" ]] \
            || [[ "${INPUT_FULL}" == "true" ]] \
            || [[ "${HAS_CI_FULL_RUN_LABEL}" == "true" ]]; then
            run_build="true"
          fi
          echo "run_build=${run_build}" >> "$GITHUB_OUTPUT"

  zizmor:
    name: Check GitHub Actions workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run zizmor
        continue-on-error: true
        uses: j178/prek-action@53276d8b0d10f8b6672aa85b4588c6921d0370cc # v2.0.1
        with:
          extra-args: --all-files zizmor

  lint-hadolint:
    name: Check ${{ matrix.file }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info]
    strategy:
      fail-fast: false
      matrix:
        file:
          - Dockerfile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Register hadolint problem matcher
        run: echo "::add-matcher::.github/workflows/matchers/hadolint.json"
      # docker://hadolint breaks Dependabot github-actions update_files; use the official action.
      - name: Check ${{ matrix.file }}
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ matrix.file }}

  pnpm-install:
    name: Prepare dependencies (pnpm)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

  lint-eslint:
    name: ESLint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info, pnpm-install, zizmor, lint-hadolint]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ESLint
        run: pnpm lint

  build:
    name: Typecheck & Vite build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info, pnpm-install, lint-eslint]
    if: |
      needs.info.outputs.lint_only != 'true'
      && needs.info.outputs.run_build == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [info, pnpm-install]
    if: |
      needs.info.outputs.requirements == 'true'
      && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          license-check: false
