version: 2
updates:
  # 私有 action（muthur-command/*）无 Dependabot 仓库授权时会 update_files 失败。
  # ignore 通配符无法可靠匹配多级路径（dependabot-core#11263），故用 allow 白名单：
  # 仅下列公共 action 参与版本更新；workflow 新增 action 时请同步追加。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - dependency
      - github_actions
    allow:
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/dependency-review-action"
      - dependency-name: "actions/github-script"
      - dependency-name: "actions/setup-node"
      - dependency-name: "actions/setup-python"
      - dependency-name: "actions/stale"
      - dependency-name: "dorny/paths-filter"
      - dependency-name: "github/codeql-action/analyze"
      - dependency-name: "github/codeql-action/init"
      - dependency-name: "hadolint/hadolint-action"
      - dependency-name: "j178/prek-action"
      - dependency-name: "pnpm/action-setup"
      - dependency-name: "release-drafter/release-drafter"
      - dependency-name: "rhysd/changelog-from-release/action"
    cooldown:
      default-days: 7
