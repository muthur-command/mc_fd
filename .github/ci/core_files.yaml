# Paths that should trigger a full frontend check (lint + build).
core:
  - "src/**"
  - "public/**"
  - "index.html"
  - "package.json"
  - "pnpm-lock.yaml"
  - "vite.config.*"
  - "tsconfig*.json"
  - "eslint.config.*"
  - "components.json"
  - "tailwind.config.*"
  - "postcss.config.*"
  - "landingpage/**"
  - ".github/**"

# Lockfile / manifest changes (dependency-review gate).
requirements:
  - "package.json"
  - "pnpm-lock.yaml"
